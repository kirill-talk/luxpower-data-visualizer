name: Build Android Widget APK

on:
  push:
    branches: [main]
    paths:
      - 'android-widget/**'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cache Android Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build Debug APK
        working-directory: ./android-widget
        run: gradle assembleDebug --no-daemon

      - name: Copy APK
        run: cp android-widget/app/build/outputs/apk/debug/app-debug.apk android-widget/luxpower-battery-widget.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luxpower-battery-widget-apk
          path: android-widget/luxpower-battery-widget.apk
